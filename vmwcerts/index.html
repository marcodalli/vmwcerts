<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certifications dashboard</title><link rel="stylesheet" href="/style.css"></head>
<body data-page="dashboard"><header><img class="brand-logo" src="https://evoila.com/wp-content/uploads/2026/08/evoila_logo_horizontal_full_color_white_text.svg" alt="evoila"><h1>Certifications dashboard</h1></header>
<nav><a href="/" aria-current="page">Dashboard</a><a href="/certifications.html">Certifications</a><a href="/settings.html">Settings</a></nav>
<main><section class="knights"><div class="section-head"><div><h2>Broadcom Knight</h2><div class="hint">Summary of Knight certifications earned by candidates.</div></div><button id="reload" class="secondary" type="button">Refresh data</button></div><div class="panel"><div id="knight-table" class="loading">Loading…</div></div></section>
<section class="partnership-section"><div class="section-head"><div><h2>Partnership requirements</h2></div><label class="partnership-picker">Level<select id="partnership-level"><option value="Pinnacle">Pinnacle</option><option value="Premier">Premiere</option><option value="Select">Select</option></select></label></div><div class="panel"><div id="partnership-table" class="loading">Loading requirements…</div></div></section>
<div class="toolbar"><div><h2>Certifications by focus product</h2><div id="status" class="status">Loading…</div></div></div><div class="panel"><div id="dashboard" class="loading">Loading transcripts…</div></div><ul id="errors" class="errors"></ul><p id="classification-note" class="foot"></p></main>
<dialog id="details-dialog" class="details-dialog" aria-labelledby="details-title"><div class="details-head"><h2 id="details-title"></h2><button id="details-close" class="secondary" type="button">Close</button></div><div id="details-content" class="details-content"></div></dialog>
<script src="/app.js" defer></script></body></html>
