<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accesso · impostazioni certificazioni</title><link rel="stylesheet" href="/style.css"></head>
<body><header><img class="brand-logo" src="https://evoila.com/wp-content/uploads/2026/08/evoila_logo_horizontal_full_color_white_text.svg" alt="evoila"><h1>Impostazioni</h1></header>
<main><form id="login-form" class="password-form login-form"><label>Password<input name="password" type="password" autocomplete="current-password" required autofocus></label><div class="buttons"><button class="primary" type="submit">Accedi</button><span id="login-status" class="status" role="status"></span></div></form></main>
<script>
document.querySelector("#login-form").addEventListener("submit",async event=>{event.preventDefault();const form=event.currentTarget,status=document.querySelector("#login-status"),button=form.querySelector("button");button.disabled=true;status.textContent="Verifica…";try{const response=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:new FormData(form).get("password")})}),data=await response.json();if(!response.ok)throw Error(data.error||`HTTP ${response.status}`);const next=new URLSearchParams(location.search).get("next");location.assign(next==="/settings.html"?next:"/settings.html")}catch(error){status.textContent=error.message;button.disabled=false}});
</script></body></html>
